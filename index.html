<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Dining Tracker</title>
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Dining" />
  <meta name="theme-color" content="#f6f3ee" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="manifest" href="manifest.json" />
  <style>
    :root {
      --bg: #f6f3ee; --card: #ffffff; --ink: #1f2420; --muted: #6b716c;
      --line: #e4dfd6; --accent: #2f6b4f; --accent-ink: #ffffff;
      --warn: #b4542d; --warn-bg: #fbeee7; --ok-bg: #e8f1ec;
      --radius: 18px;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; background: var(--bg); color: var(--ink);
      font: 17px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; }
    body { padding: env(safe-area-inset-top) 0 calc(76px + env(safe-area-inset-bottom)); min-height: 100vh; }
    main { max-width: 520px; margin: 0 auto; padding: 16px; }
    h1 { font-size: 28px; margin: 8px 0 16px; letter-spacing: -0.02em; }
    h2 { font-size: 19px; margin: 24px 0 10px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; }
    .muted { color: var(--muted); }
    .small { font-size: 14px; }
    .big { font-size: 52px; font-weight: 700; letter-spacing: -0.03em; line-height: 1.05; font-variant-numeric: tabular-nums; }
    .neg { color: var(--warn); }
    .bar { height: 12px; background: var(--line); border-radius: 99px; overflow: hidden; margin: 14px 0 8px; }
    .bar > div { height: 100%; background: var(--accent); border-radius: 99px; transition: width .3s; }
    .bar.over > div { background: var(--warn); }
    .pill { display: inline-block; padding: 3px 10px; border-radius: 99px; font-size: 14px; }
    .pill.ok { background: var(--ok-bg); color: var(--accent); }
    .pill.warn { background: var(--warn-bg); color: var(--warn); }
    button, .btn { font: inherit; border: 0; border-radius: 14px; padding: 16px; width: 100%;
      font-weight: 600; cursor: pointer; display: block; text-align: center; }
    .primary { background: var(--accent); color: var(--accent-ink); font-size: 19px; }
    .secondary { background: transparent; color: var(--accent); border: 1.5px solid var(--accent); }
    .danger { background: transparent; color: var(--warn); border: 1.5px solid var(--warn); }
    .link { background: none; color: var(--accent); padding: 10px; font-weight: 500; }
    button:disabled { opacity: .5; }
    .stack > * + * { margin-top: 12px; }
    label { display: block; font-size: 15px; color: var(--muted); margin-bottom: 6px; }
    input { font: inherit; font-size: 19px; width: 100%; padding: 14px; border: 1px solid var(--line);
      border-radius: 12px; background: #fff; color: var(--ink); }
    input:focus { outline: 2px solid var(--accent); border-color: transparent; }
    .money { position: relative; }
    .money span { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); font-size: 19px; color: var(--muted); }
    .money input { padding-left: 30px; font-size: 28px; font-weight: 600; }
    .list { list-style: none; margin: 0; padding: 0; }
    .list li { display: flex; justify-content: space-between; align-items: center; gap: 12px;
      padding: 14px 4px; border-bottom: 1px solid var(--line); cursor: pointer; }
    .list li:last-child { border-bottom: 0; }
    .list .amt { font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .row { display: flex; justify-content: space-between; gap: 8px; }
    .notice { padding: 12px 14px; border-radius: 12px; background: var(--warn-bg); color: var(--warn); font-size: 15px; }
    .notice.info { background: var(--ok-bg); color: var(--accent); }
    nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; background: rgba(255,255,255,.95);
      border-top: 1px solid var(--line); display: flex; padding-bottom: env(safe-area-inset-bottom);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
    nav.tabs button { background: none; border-radius: 0; padding: 14px 4px 16px; color: var(--muted); font-weight: 600; font-size: 15px; }
    nav.tabs button.active { color: var(--accent); }
    .hidden { display: none !important; }
    .spinner { width: 42px; height: 42px; border: 4px solid var(--line); border-top-color: var(--accent);
      border-radius: 50%; animation: spin 0.9s linear infinite; margin: 30px auto 16px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .week { padding: 14px 0; border-bottom: 1px solid var(--line); }
    .week:last-child { border-bottom: 0; }
    .week.current { background: var(--ok-bg); margin: 0 -18px; padding: 14px 18px; }
    .monthnav { display: flex; align-items: center; justify-content: space-between; }
    .monthnav button { width: auto; padding: 8px 16px; background: var(--card); border: 1px solid var(--line); color: var(--ink); }
  </style>
</head>
<body>
  <main id="app">
    <div class="spinner"></div>
  </main>
  <nav class="tabs hidden" id="tabs">
    <button data-tab="home">This week</button>
    <button data-tab="summary">Summary</button>
    <button data-tab="settings">Settings</button>
  </nav>
  <script type="module" src="app.js"></script>
</body>
</html>
